<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
      :root {
        --bg: #07131f;
        --panel: #0f1d2d;
        --panel-2: #15283b;
        --muted: #9bb4c9;
        --text: #edf4ff;
        --gold: #f0c765;
        --green: #6cd19a;
        --blue: #6ab6ff;
        --red: #ff7a7a;
        --purple: #b78dff;
        --shadow: rgba(0, 0, 0, 0.3);
      }

      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(circle at top, #102235, var(--bg) 58%);
        color: var(--text);
        font-family: Inter, "Segoe UI", Arial, sans-serif;
      }
      body { padding: 20px; }
      h1, h2, h3, p { margin: 0; }
      button, input, select { font: inherit; }
      .app {
        max-width: 1240px;
        margin: 0 auto;
      }
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        margin-bottom: 18px;
      }
      .brand {
        font-size: clamp(2rem, 4vw, 3.4rem);
        font-weight: 900;
        letter-spacing: 0.04em;
      }
      .brand .accent { color: var(--gold); }
      .modeTabs {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .tab {
        border: 1px solid rgba(255,255,255,0.12);
        background: rgba(255,255,255,0.03);
        color: var(--text);
        padding: 10px 18px;
        border-radius: 999px;
        cursor: pointer;
        transition: 0.18s ease;
      }
      .tab.active {
        background: linear-gradient(135deg, rgba(240,199,101,0.16), rgba(106,182,255,0.16));
        border-color: rgba(240,199,101,0.65);
        color: var(--gold);
      }

      .panel {
        background: linear-gradient(180deg, rgba(20,34,48,0.95), rgba(9,18,28,0.98));
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 18px;
        box-shadow: 0 18px 36px var(--shadow);
        padding: 18px;
        margin-bottom: 18px;
      }

      .originGrid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 12px;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 8px;
        background: rgba(255,255,255,0.03);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 12px;
        padding: 12px;
      }
      .field label {
        font-size: 0.72rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .field input, .field select {
        width: 100%;
        border-radius: 10px;
        background: rgba(5, 15, 22, 0.7);
        border: 1px solid rgba(255,255,255,0.08);
        color: var(--text);
        padding: 10px 12px;
      }

      .buildWrap {
        display: grid;
        grid-template-columns: 1.2fr 0.8fr;
        gap: 18px;
      }

      .reelCard {
        background: radial-gradient(circle at top, rgba(140,181,245,0.14), rgba(18,30,48,0.88));
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 18px;
        padding: 18px;
        min-height: 320px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 16px;
      }
      .cardHeader {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .cardMeta { color: var(--muted); font-size: 0.8rem; }
      .cardName { font-size: clamp(1.3rem, 2vw, 2rem); font-weight: 800; }
      .ratingBig {
        font-size: clamp(2.4rem, 4vw, 4rem);
        font-weight: 900;
        color: var(--gold);
      }
      .statGrid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(90px, 1fr));
        gap: 10px;
      }
      .miniStat {
        padding: 10px;
        border-radius: 12px;
        background: rgba(255,255,255,0.03);
        border: 1px solid rgba(255,255,255,0.06);
      }
      .miniStat .k {
        font-size: 0.68rem;
        text-transform: uppercase;
        color: var(--muted);
        letter-spacing: 0.08em;
      }
      .miniStat .v {
        font-size: 1.25rem;
        font-weight: 800;
        margin-top: 4px;
      }
      .actionRow {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .btn {
        border-radius: 10px;
        border: 1px solid rgba(255,255,255,0.12);
        padding: 10px 16px;
        background: rgba(255,255,255,0.04);
        color: var(--text);
        cursor: pointer;
        font-weight: 700;
      }
      .btn.primary {
        background: linear-gradient(135deg, rgba(240,199,101,0.18), rgba(106,182,255,0.18));
        border-color: rgba(240,199,101,0.58);
      }
      .btn.success {
        background: linear-gradient(135deg, rgba(108,209,154,0.18), rgba(106,182,255,0.14));
        border-color: rgba(108,209,154,0.5);
      }
      .btn.warn {
        background: linear-gradient(135deg, rgba(255,122,122,0.2), rgba(176,110,255,0.12));
        border-color: rgba(255,122,122,0.48);
      }

      .sidePanel {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .metricBox {
        border: 1px solid rgba(255,255,255,0.08);
        background: rgba(255,255,255,0.03);
        border-radius: 12px;
        padding: 14px;
      }
      .metricBox .label {
        font-size: 0.7rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .metricBox .value {
        font-size: clamp(1.7rem, 3vw, 2.8rem);
        font-weight: 900;
        margin-top: 8px;
      }
      .tagList {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 8px;
      }
      .tag {
        display: inline-block;
        border-radius: 999px;
        border: 1px solid rgba(255,255,255,0.08);
        background: rgba(255,255,255,0.04);
        color: var(--muted);
        padding: 5px 8px;
        font-size: 0.7rem;
      }
      .tag.good { color: var(--green); border-color: rgba(108,209,154,0.48); }
      .tag.lore { color: var(--purple); border-color: rgba(183,141,255,0.48); }

      .slotBoard {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: 12px;
      }
      .slot {
        border-radius: 12px;
        border: 1px solid rgba(255,255,255,0.08);
        background: rgba(255,255,255,0.03);
        padding: 12px;
        min-height: 110px;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 6px;
      }
      .slot.filled {
        background: rgba(108,209,154,0.08);
        border-color: rgba(108,209,154,0.4);
      }
      .slot .name { color: var(--muted); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; }
      .slot .value { font-size: 2rem; font-weight: 900; }
      .slot:disabled { cursor: not-allowed; opacity: 0.7; }

      .careerCard {
        display: none;
      }
      .careerCard.visible { display: block; }
      .seasonList { display: grid; gap: 12px; }
      .seasonItem {
        background: rgba(255,255,255,0.03);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 12px;
        padding: 12px;
      }
      .seasonHeader {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        margin-bottom: 8px;
      }
      .chipRow { display: flex; flex-wrap: wrap; gap: 8px; }
      .chip {
        display: inline-block;
        border: 1px solid rgba(255,255,255,0.08);
        background: rgba(255,255,255,0.04);
        color: var(--muted);
        border-radius: 999px;
        padding: 5px 8px;
        font-size: 0.72rem;
      }
      .warning { color: var(--red); }

      @media (max-width: 850px) {
        body { padding: 12px; }
        .topbar { flex-direction: column; align-items: flex-start; }
        .buildWrap { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="topbar">
        <div class="brand">Rookie <span class="accent">to Legend</span></div>
        <div class="modeTabs">
          <button class="tab active" data-mode="hitter">Hitter</button>
          <button class="tab" data-mode="pitcher">Pitcher</button>
        </div>
      </div>

      <section class="panel">
        <div class="originGrid">
          <div class="field">
            <label>Name</label>
            <input id="nameInput" value="Rookie" maxlength="24" />
          </div>
          <div class="field">
            <label>Handedness</label>
            <select id="handInput">
              <option value="R">R</option>
              <option value="L">L</option>
              <option value="S">S</option>
            </select>
          </div>
          <div class="field">
            <label>Position / Role</label>
            <select id="positionInput"></select>
          </div>
          <div class="field">
            <label>Origin</label>
            <select id="originInput">
              <option value="High School">High School</option>
              <option value="College">College</option>
              <option value="International">International</option>
              <option value="Independent League">Independent League</option>
              <option value="Overseas Pro">Overseas Pro</option>
            </select>
          </div>
          <div class="field">
            <label>Archetype</label>
            <select id="archetypeInput"></select>
          </div>
        </div>
      </section>

      <section class="panel">
        <div class="buildWrap">
          <div class="reelCard">
            <div class="cardHeader">
              <div>
                <div class="cardMeta" id="cardMeta">Current card</div>
                <div class="cardName" id="cardName">Waiting for a spin</div>
              </div>
              <div class="ratingBig" id="cardOverall">--</div>
            </div>

            <div id="cardStats" class="statGrid"></div>

            <div class="actionRow">
              <button class="btn primary" id="spinBtn">Spin Build</button>
              <button class="btn" id="reSpinBtn">Re-spin</button>
              <button class="btn" id="primeBtn">Prime Upgrade</button>
              <button class="btn" id="snagBtn">Snag</button>
              <button class="btn" id="resetBtn">Reset</button>
            </div>
          </div>

          <div class="sidePanel">
            <div class="metricBox">
              <div class="label">Projected Overall</div>
              <div class="value" id="overallValue">0</div>
            </div>

            <div class="metricBox">
              <div class="label">Build Status</div>
              <div class="value" id="statusValue">0 / 8</div>
              <div class="tagList" id="tagList"></div>
            </div>

            <div class="metricBox">
              <div class="label">Draft Stock</div>
              <div class="value" id="stockValue">--</div>
            </div>

            <div class="metricBox">
              <div class="label">Power-Ups</div>
              <div class="tagList" id="powerList"></div>
            </div>

            <div class="actionRow">
              <button class="btn success" id="careerBtn">Start Career</button>
              <button class="btn" id="saveBtn">Save Career</button>
            </div>
          </div>
        </div>
      </section>

      <section class="panel">
        <div class="slotBoard" id="slotBoard"></div>
      </section>

      <section class="panel careerCard" id="careerCard">
        <h2>Career Summary</h2>
        <div class="statGrid" id="careerSummary" style="margin-top: 12px;"></div>
        <div class="seasonList" id="seasonList" style="margin-top: 18px;"></div>
      </section>
    </div>

        { name: 'Jacob deGrom', team: 'Mets', era: 'MD', country: 'USA', role:'SP', cat:'A', Vel:99, Brk:97, Str:97, GB:50, Cmd:92, Clu:80, Def:60, Frm:85, Sta:70 },
        { name: 'Gerrit Cole', team: 'Yankees', era: 'MD', country: 'USA', role:'SP', cat:'A', Vel:96, Brk:90, Str:94, GB:45, Cmd:86, Clu:80, Def:70, Frm:88, Sta:86 },
        { name: 'Tarik Skubal', team: 'Tigers', era: 'MD', country: 'USA', role:'SP', cat:'A', Vel:96, Brk:92, Str:96, GB:50, Cmd:92, Clu:82, Def:65, Frm:90, Sta:84 },
        { name: 'Paul Skenes', team: 'Pirates', era: 'MD', country: 'USA', role:'SP', cat:'A', Vel:99, Brk:90, Str:96, GB:60, Cmd:88, Clu:80, Def:70, Frm:95, Sta:82 },
        { name: 'Corbin Burnes', team: 'Diamondbacks', era: 'MD', country: 'USA', role:'SP', cat:'A', Vel:94, Brk:95, Str:92, GB:70, Cmd:90, Clu:82, Def:70, Frm:82, Sta:84 },
        { name: 'Chris Sale', team: 'Braves', era: 'MD', country: 'USA', role:'SP', cat:'A', Vel:93, Brk:97, Str:98, GB:45, Cmd:90, Clu:80, Def:60, Frm:92, Sta:78 },
        { name: 'Josh Hader', team: 'Astros', era: 'MD', country: 'USA', role:'CL', cat:'A', Vel:94, Brk:92, Str:96, GB:40, Cmd:70, Clu:82, Def:55, Frm:80, Sta:35 },
        { name: 'Edwin Díaz', team: 'Mets', era: 'MD', country: 'PRI', role:'CL', cat:'A', Vel:99, Brk:96, Str:98, GB:40, Cmd:78, Clu:78, Def:55, Frm:72, Sta:35 },
        { name: 'Shane Bieber', team: 'Guardians', era: 'MD', country: 'USA', role:'SP', cat:'A', Vel:90, Brk:92, Str:92, GB:60, Cmd:95, Clu:76, Def:65, Frm:82, Sta:80 }
      ];

      const SLOT_DEFS = {
        hitter: [
          { key: 'Contact', label: 'Contact' },
          { key: 'Power', label: 'Power' },
          { key: 'Discipline', label: 'Discipline' },
          { key: 'Vision', label: 'Vision' },
          { key: 'Clutch', label: 'Clutch' },
          { key: 'Speed', label: 'Speed' },
          { key: 'Defense', label: 'Defense' },
          { key: 'Frame', label: 'Frame' }
        ],
        pitcher: [
          { key: 'Velocity', label: 'Velocity' },
          { key: 'Break', label: 'Break' },
          { key: 'Strikeout', label: 'Strikeout' },
          { key: 'Ground Ball', label: 'Ground Ball' },
          { key: 'Command', label: 'Command' },
          { key: 'Clutch', label: 'Clutch' },
          { key: 'Defense', label: 'Defense' },
          { key: 'Frame', label: 'Frame' },
          { key: 'Stamina', label: 'Stamina' }
        ]
      };

      const POSITION_MAP = {
        hitter: ['CF', 'RF', 'LF', 'SS', '3B', '2B', '1B', 'C', 'DH'],
        pitcher: ['SP', 'RP', 'CL']
      };

      const ARCHETYPES = {
        hitter: ['Slugger', 'Table Setter', 'Five Tool', 'Contact Artist', 'Glove First', 'Late Bloomer'],
        pitcher: ['Power Arm', 'Groundballer', 'Finesse', 'Workhorse', 'Competitor', 'Fireballer']
      };

      const state = {
        mode: 'hitter',
        name: 'Rookie',
        hand: 'R',
        origin: 'High School',
        archetype: 'Slugger',
        position: 'CF',
        buildSlots: {},
        currentCard: null,
        career: null,
        powerUps: { reSpin: 2, prime: 1, snag: 1 }
      };

      function clamp(value, min, max) { return Math.min(max, Math.max(min, value)); }
      function average(list) { return list.length ? list.reduce((sum, n) => sum + n, 0) / list.length : 0; }

      function getStatKeys() {
        return SLOT_DEFS[state.mode].map((slot) => slot.key);
      }

      function getCurrentPlayerPool() {
        return state.mode === 'hitter' ? hitterPool : pitcherPool;
      }

      function generateCard() {
        const pool = getCurrentPlayerPool();
        const player = pool[Math.floor(Math.random() * pool.length)];
        const attrs = {};
        const statMap = state.mode === 'hitter' ? {
          Contact: 'Con', Power: 'Pow', Discipline: 'Dis', Vision: 'Vis', Clutch: 'Clu', Speed: 'Spd', Defense: 'Def', Frame: 'Frm'
        } : {
          Velocity: 'Vel', Break: 'Brk', Strikeout: 'Str', 'Ground Ball': 'GB', Command: 'Cmd', Clutch: 'Clu', Defense: 'Def', Frame: 'Frm', Stamina: 'Sta'
        };

        getStatKeys().forEach((slotKey) => {
          const key = statMap[slotKey];
          attrs[slotKey] = clamp(player[key] ?? 50, 30, 99);
        });

        return { player, attrs, overall: weightedOverall(attrs, state.mode) };
      }

      function weightedOverall(attrs, mode) {
        const weights = mode === 'hitter' ? {
          Contact: 1.25, Power: 1.2, Discipline: 1.1, Vision: 1.1, Clutch: 1.0, Speed: 0.9, Defense: 1.0, Frame: 0.5
        } : {
          Strikeout: 1.25, 'Ground Ball': 1.1, Command: 1.25, Velocity: 1.0, Break: 1.1, Stamina: 1.0, Clutch: 1.0, Defense: 0.5, Frame: 0.5
        };

        let totalWeight = 0;
        let weighted = 0;
        Object.entries(attrs).forEach(([key, val]) => {
          const w = weights[key] || 1;
          totalWeight += w;
          weighted += val * w;
        });
        return totalWeight ? weighted / totalWeight : 0;
      }

      function renderModeOptions() {
        const posSelect = document.getElementById('positionInput');
        const archSelect = document.getElementById('archetypeInput');
        posSelect.innerHTML = '';
        archSelect.innerHTML = '';

        POSITION_MAP[state.mode].forEach((choice) => {
          const option = document.createElement('option');
          option.value = choice;
          option.textContent = choice;
          posSelect.appendChild(option);
        });

        ARCHETYPES[state.mode].forEach((choice) => {
          const option = document.createElement('option');
          option.value = choice;
          option.textContent = choice;
          archSelect.appendChild(option);
        });

        state.position = posSelect.value;
        state.archetype = archSelect.value;
      }

      function updateProjectedOverall() {
        const slots = SLOT_DEFS[state.mode];
        const filled = slots.filter((slot) => state.buildSlots[slot.key] !== undefined)
          .map((slot) => [slot.key, state.buildSlots[slot.key]]);
        const overall = buildOverallFromValues(filled);
        const statusCount = filled.length;
        document.getElementById('overallValue').textContent = Math.round(overall);
        document.getElementById('statusValue').textContent = `${statusCount} / ${slots.length}`;

        const tags = [];
        if (overall >= 85) tags.push({ label: 'Star', className: 'good' });
        if (overall >= 75) tags.push({ label: 'Ready', className: 'good' });
        if (statusCount >= slots.length * 0.75) tags.push({ label: 'Strong', className: 'good' });
        if (state.currentCard) tags.push({ label: 'Live', className: 'lore' });

        document.getElementById('tagList').innerHTML = tags.map((tag) => `<span class="tag ${tag.className}">${tag.label}</span>`).join('');

        const stock = Math.round(overall + (state.origin === 'College' ? 4 : 0) + (state.origin === 'International' ? 6 : 0) + (state.archetype === 'Five Tool' ? 3 : 0));
        document.getElementById('stockValue').textContent = `${stock} / 99`;
      }

      function buildOverallFromValues(entries) {
        const data = Object.fromEntries(entries);
        const weights = state.mode === 'hitter' ? {
          Contact:1.25, Power:1.2, Discipline:1.1, Vision:1.1, Clutch:1.0, Speed:0.9, Defense:1.0, Frame:0.5
        } : {
          Strikeout:1.25, 'Ground Ball':1.1, Command:1.25, Velocity:1.0, Break:1.1, Stamina:1.0, Clutch:1.0, Defense:0.5, Frame:0.5
        };

        let totalWeight = 0;
        let weighted = 0;
        Object.entries(data).forEach(([key, value]) => {
          const w = weights[key] || 1;
          totalWeight += w;
          weighted += value * w;
        });

        return totalWeight ? weighted / totalWeight : 0;
      }

      function renderCurrentCard() {
        const cardName = document.getElementById('cardName');
        const meta = document.getElementById('cardMeta');
        const overallBig = document.getElementById('cardOverall');
        const grid = document.getElementById('cardStats');

        if (!state.currentCard) {
          cardName.textContent = 'Waiting for a spin';
          meta.textContent = 'Current card';
          overallBig.textContent = '--';
          grid.innerHTML = '';
          return;
        }

        const card = state.currentCard;
        const player = card.player;
        cardName.textContent = player.name;
        meta.textContent = `${player.team} • ${player.era} • ${player.country}`;
        overallBig.textContent = Math.round(card.overall);

        const entries = Object.entries(card.attrs);
        grid.innerHTML = entries.map(([key, value]) => `
          <div class="miniStat">
            <div class="k">${key}</div>
            <div class="v">${value}</div>
          </div>
        `).join('');
      }

      function renderSlots() {
        const board = document.getElementById('slotBoard');
        board.innerHTML = '';

        SLOT_DEFS[state.mode].forEach((slot) => {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = `slot ${state.buildSlots[slot.key] !== undefined ? 'filled' : ''}`;
          button.disabled = !state.currentCard || state.buildSlots[slot.key] !== undefined;
          button.innerHTML = `
            <div class="name">${slot.label}</div>
            <div class="value">${state.buildSlots[slot.key] ?? '--'}</div>
          `;
          button.addEventListener('click', () => assignCurrentCard(slot.key));
          board.appendChild(button);
        });
      }

      function assignCurrentCard(slotKey) {
        if (!state.currentCard) return;
        if (state.buildSlots[slotKey] !== undefined) return;
        state.buildSlots[slotKey] = state.currentCard.attrs[slotKey];
        state.currentCard = null;
        renderSlots();
        renderCurrentCard();
        updateProjectedOverall();
      }

      function renderPowerUps() {
        const powerList = document.getElementById('powerList');
        const entries = [
          ['Re-spin', state.powerUps.reSpin],
          ['Prime', state.powerUps.prime],
          ['Snag', state.powerUps.snag]
        ];
        powerList.innerHTML = entries.map(([label, count]) => `<span class="tag">${label}: ${count}</span>`).join('');
      }

      function spinBuild() {
        state.currentCard = generateCard();
        renderCurrentCard();
        renderSlots();
      }

      function reSpinCurrent() {
        if (state.powerUps.reSpin <= 0) return;
        state.powerUps.reSpin -= 1;
        state.currentCard = null;
        renderPowerUps();
        renderCurrentCard();
        renderSlots();
        spinBuild();
      }

      function primeUpgrade() {
        if (state.powerUps.prime <= 0 || !state.currentCard) return;
        state.powerUps.prime -= 1;
        const attrs = { ...state.currentCard.attrs };
        Object.keys(attrs).forEach((key) => {
          const current = attrs[key];
          attrs[key] = clamp(Math.round(current + ((99 - current) * 0.25)), 30, 99);
        });
        state.currentCard = { ...state.currentCard, attrs, overall: weightedOverall(attrs, state.mode) };
        renderPowerUps();
        renderCurrentCard();
        renderSlots();
      }

      function snagCard() {
        if (state.powerUps.snag <= 0 || !state.currentCard) return;
        state.powerUps.snag -= 1;
        const emptyKeys = SLOT_DEFS[state.mode].filter((slot) => state.buildSlots[slot.key] === undefined).map((slot) => slot.key);
        if (!emptyKeys.length) return;
        const targetKey = emptyKeys[Math.floor(Math.random() * emptyKeys.length)];
        state.buildSlots[targetKey] = state.currentCard.attrs[targetKey];
        state.currentCard = null;
        renderPowerUps();
        renderSlots();
        renderCurrentCard();
        updateProjectedOverall();
      }

      function resetBuild() {
        state.buildSlots = {};
        state.currentCard = null;
        state.powerUps = { reSpin: 2, prime: 1, snag: 1 };
        renderSlots();
        renderCurrentCard();
        updateProjectedOverall();
        renderPowerUps();
      }

      function simulateCareer() {
        const slots = SLOT_DEFS[state.mode];
        const filled = slots.filter((slot) => state.buildSlots[slot.key] !== undefined);
        if (filled.length < slots.length) {
          alert('Fill all slots before starting your career.');
          return;
        }

        const buildOverall = Math.round(buildOverallFromValues(filled.map((slot) => [slot.key, state.buildSlots[slot.key]])));
        const years = [];

        for (let season = 1; season <= (state.mode === 'hitter' ? 8 : 7); season++) {
          if (state.mode === 'hitter') {
            const avg = clamp(0.235 + (buildOverall - 55) / 400 + (Math.random() - 0.5) * 0.04, 0.200, 0.340);
            const hr = clamp(6 + (buildOverall - 50) * 0.75 + Math.random() * 18, 5, 60);
            const rbi = clamp(35 + (buildOverall - 45) * 1.2 + Math.random() * 60, 20, 150);
            const sb = clamp((state.buildSlots.Speed || 50) / 4 + Math.random() * 18, 0, 65);
            const war = clamp(0.7 + (buildOverall - 50) / 16 + Math.random() * 4.5, 0.3, 10.5);
            const awards = season === 1 ? 'Rookie of the Year' : (Math.random() > 0.7 ? 'All-Star' : '');
            years.push({
              label: `Season ${season}`,
              stats: `AVG ${avg.toFixed(3)} • HR ${Math.round(hr)} • RBI ${Math.round(rbi)} • SB ${Math.round(sb)} • WAR ${war.toFixed(1)}`,
              awards: awards ? `${awards}` : 'Regular season'
            });
          } else {
            const era = clamp(3.0 - (buildOverall - 60) / 18 + (Math.random() - 0.5) * 0.9, 1.6, 5.2);
            const k = clamp(100 + (buildOverall - 50) * 2.6 + Math.random() * 90, 80, 320);
            const wins = clamp(5 + (buildOverall - 55) * 0.42 + Math.random() * 12, 2, 26);
            const war = clamp(0.8 + (buildOverall - 50) / 14 + Math.random() * 4.2, 0.5, 10.5);
            const awards = season === 1 ? 'Rookie of the Year' : (Math.random() > 0.75 ? 'Cy Young' : '');
            years.push({
              label: `Season ${season}`,
              stats: `W ${Math.round(wins)} • ERA ${era.toFixed(2)} • K ${Math.round(k)} • WAR ${war.toFixed(1)}`,
              awards: awards ? `${awards}` : 'Starter workload'
            });
          }
        }

        const legacy = clamp(buildOverall * 1.35 + years.length * 4 + (state.mode === 'hitter' ? 18 : 12), 0, 99);
        let verdict = 'Cup of Coffee';
        if (legacy >= 80) verdict = 'Hall of Famer';
        else if (legacy >= 62) verdict = 'All-Star Star';
        else if (legacy >= 40) verdict = 'Solid Regular';
        else if (legacy >= 20) verdict = 'Role Player';

        state.career = {
          buildOverall,
          legacy,
          verdict,
          years,
          name: state.name,
          mode: state.mode,
          origin: state.origin,
          archetype: state.archetype,
          position: state.position
        };

        renderCareer();
        saveCareer();
      }

      function renderCareer() {
        const card = document.getElementById('careerCard');
        const summary = document.getElementById('careerSummary');
        const list = document.getElementById('seasonList');

        if (!state.career) return;
        card.classList.add('visible');

        summary.innerHTML = `
          <div class="miniStat"><div class="k">Name</div><div class="v">${state.career.name}</div></div>
          <div class="miniStat"><div class="k">Overall</div><div class="v">${state.career.buildOverall}</div></div>
          <div class="miniStat"><div class="k">Legacy</div><div class="v">${state.career.legacy.toFixed(1)}</div></div>
          <div class="miniStat"><div class="k">Verdict</div><div class="v">${state.career.verdict}</div></div>
        `;

        list.innerHTML = state.career.years.map((item) => `
          <div class="seasonItem">
            <div class="seasonHeader">
              <strong>${item.label}</strong>
              <span class="chip">${item.awards}</span>
            </div>
            <div>${item.stats}</div>
          </div>
        `).join('');
      }

      function saveCareer() {
        const payload = JSON.stringify({
          mode: state.mode,
          name: state.name,
          position: state.position,
          origin: state.origin,
          archetype: state.archetype,
          buildSlots: state.buildSlots,
          career: state.career
        });
        try {
          localStorage.setItem('rtl-career', payload);
        } catch (err) {
          console.warn('Storage unavailable');
        }
      }

      function loadSavedCareer() {
        try {
          const raw = localStorage.getItem('rtl-career');
          if (!raw) return;
          const saved = JSON.parse(raw);
          if (!saved) return;
          state.mode = saved.mode || state.mode;
          state.name = saved.name || state.name;
          state.position = saved.position || state.position;
          state.origin = saved.origin || state.origin;
          state.archetype = saved.archetype || state.archetype;
          state.buildSlots = saved.buildSlots || {};
          state.career = saved.career || null;
          document.getElementById('nameInput').value = state.name;
          renderModeOptions();
          renderCareer();
          renderSlots();
          renderCurrentCard();
          updateProjectedOverall();
        } catch (err) {
          console.warn('Could not load saved career');
        }
      }

      function bindUI() {
        document.querySelectorAll('.tab').forEach((button) => {
          button.addEventListener('click', () => {
            state.mode = button.dataset.mode;
            document.querySelectorAll('.tab').forEach((tab) => tab.classList.toggle('active', tab === button));
            renderModeOptions();
            resetBuild();
          });
        });

        document.getElementById('nameInput').addEventListener('input', (event) => {
          state.name = event.target.value.trim() || 'Rookie';
          document.getElementById('nameInput').value = state.name;
        });

        document.getElementById('handInput').addEventListener('change', (event) => {
          state.hand = event.target.value;
        });

        document.getElementById('positionInput').addEventListener('change', (event) => {
          state.position = event.target.value;
        });

        document.getElementById('originInput').addEventListener('change', (event) => {
          state.origin = event.target.value;
          updateProjectedOverall();
        });

        document.getElementById('archetypeInput').addEventListener('change', (event) => {
          state.archetype = event.target.value;
          updateProjectedOverall();
        });

        document.getElementById('spinBtn').addEventListener('click', spinBuild);
        document.getElementById('reSpinBtn').addEventListener('click', reSpinCurrent);
        document.getElementById('primeBtn').addEventListener('click', primeUpgrade);
        document.getElementById('snagBtn').addEventListener('click', snagCard);
        document.getElementById('resetBtn').addEventListener('click', resetBuild);
        document.getElementById('careerBtn').addEventListener('click', simulateCareer);
        document.getElementById('saveBtn').addEventListener('click', saveCareer);
      }

      function init() {
        renderModeOptions();
        bindUI();
        renderPowerUps();
        resetBuild();
        loadSavedCareer();
      }

      init();
    </script>
  </body>
