<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rookie to Legend</title>
  <style>
    :root {
      --bg: #0b1320;
      --panel: #111d2c;
      --panel-2: #182a3e;
      --muted: #9bb0c8;
      --text: #edf4ff;
      --gold: #f5c76b;
      --silver: #dfe7f5;
      --bronze: #d0915a;
      --legend: #b785ff;
      --diamond: #66d8ff;
      --good: #67d294;
      --bad: #ff7a7a;
      --shadow: rgba(0,0,0,.28);
      --slot: rgb(116,149,179);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; background: linear-gradient(180deg, #081018, var(--bg));
      color: var(--text); font-family: Inter, "Segoe UI", Arial, sans-serif; min-height: 100vh;
    }
    body { padding: 24px; }
    h1, h2, h3, p { margin: 0; }
    .app {
      max-width: 1280px; margin: 0 auto;
    }
    .topbar {
      display: flex; justify-content: space-between; align-items: center;
      gap: 16px; margin-bottom: 18px;
    }
    .brand {
      font-size: clamp(1.8rem, 4vw, 3rem); font-weight: 800;
      letter-spacing: 0.04em; text-transform: uppercase;
    }
    .brand .accent { color: var(--gold); }
    .modeSelector {
      display: flex; gap: 12px; flex-wrap: wrap;
    }
    .pill {
      background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.08);
      border-radius: 999px; padding: 12px 18px; color: var(--text); cursor: pointer;
      transition: .2s ease; user-select: none;
    }
    .pill.active {
      background: linear-gradient(135deg, rgba(245,199,107,.15), rgba(103,210,148,.1));
      border-color: rgba(245,199,107,.6); color: var(--gold);
    }
    .panel {
      background: linear-gradient(180deg, rgba(17,29,44,.96), rgba(12,20,30,.96));
      border: 1px solid rgba(255,255,255,.08); border-radius: 18px; box-shadow: 0 16px 28px var(--shadow);
      padding: 18px; margin-bottom: 18px;
    }
    .originGrid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-top: 18px;
    }
    .field {
      display: flex; flex-direction: column; gap: 8px;
      background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.08); border-radius: 12px; padding: 12px;
    }
    .field label { font-size: .74rem; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
    select, input {
      width: 100%; background: rgba(8,16,24,.7); border: 1px solid rgba(255,255,255,.1); border-radius: 8px; color: var(--text); padding: 10px 12px; font-size: 1rem;
    }
    .buildWrap {
      display: grid; grid-template-columns: 1.2fr .8fr; gap: 18px;
    }
    .reelCard {
      background: radial-gradient(circle at top, rgba(179,213,255,.12), rgba(28,42,62,.3)); border: 1px solid rgba(255,255,255,.1); border-radius: 18px; padding: 18px; min-height: 250px;
      display: flex; flex-direction: column; justify-content: space-between; gap: 14px;
    }
    .playerHeadline { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .playerName { font-size: 1.6rem; font-weight: 700; }
    .playerMeta { color: var(--muted); font-size: .82rem; }
    .bigRating {
      font-size: 3rem; font-weight: 900; line-height: 1; color: var(--gold);
    }
    .slotBoard {
      display: grid; grid-template-columns: repeat(2, minmax(120px,1fr)); gap: 12px;
    }
    .slot {
      border: 1px solid rgba(255,255,255,.08); background: rgba(255,255,255,.04); border-radius: 12px; padding: 10px; min-height: 96px; cursor: pointer; transition: .2s ease; display: flex; flex-direction: column; justify-content: center;
    }
    .slot:hover { transform: translateY(-1px); border-color: rgba(245,199,107,.5); }
    .slotLabel { font-size: .72rem; color: var(--muted); text-transform: uppercase; }
    .slotValue { font-size: 1.8rem; font-weight: 800; }
    .slot.filled { background: rgba(103,210,148,.08); border-color: rgba(103,210,148,.5); }
    .slot.empty { opacity: .9; }
    .actions {
      display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px;
    }
    .button {
      background: linear-gradient(135deg, rgba(245,199,107,.18), rgba(139,105,255,.16)); border: 1px solid rgba(245,199,107,.5); border-radius: 10px; color: var(--text); padding: 10px 16px; cursor: pointer; font-weight: 700;
    }
    .button.secondary { background: rgba(255,255,255,.03); border-color: rgba(255,255,255,.08); }
    .button.warn { background: linear-gradient(135deg, rgba(255,122,122,.2), rgba(219,129,80,.12)); border-color: rgba(255,122,122,.4); }
    .statsPanel {
      display: flex; flex-direction: column; gap: 12px;
    }
    .metricBox {
      background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.08); border-radius: 12px; padding: 14px;
    }
    .metricBox .label { color: var(--muted); font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; }
    .metricBox .value { font-size: 2.2rem; font-weight: 800; margin-top: 8px; }
    .powerList {
      display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px;
    }
    .tag {
      font-size: .72rem; border-radius: 999px; padding: 5px 9px; border: 1px solid rgba(255,255,255,.08); background: rgba(255,255,255,.03); color: var(--muted);
    }
    .tag.good { border-color: rgba(103,210,148,.4); color: var(--good); }
    .tag.legend { border-color: rgba(183,133,255,.5); color: var(--legend); }
    .statsGrid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(100px,1fr)); gap: 12px;
      margin-top: 8px;
    }
    .miniStat { background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.08); border-radius: 10px; padding: 10px; }
    .miniStat .k { font-size: .7rem; color: var(--muted); text-transform: uppercase; }
    .miniStat .v { margin-top: 6px; font-size: 1.4rem; font-weight: 800; }
    .careerSection { display: none; }
    .careerSection.visible { display: block; }
    .seasonList { display: grid; gap: 12px; }
    .seasonCard {
      background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.08); border-radius: 12px; padding: 12px;
    }
    .seasonTop { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 8px; }
    .seasonMeta { color: var(--muted); font-size: .82rem; }
    .timeline { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip { font-size: .72rem; border-radius: 999px; padding: 5px 8px; background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.08); color: var(--muted); }
    @media (max-width: 900px) {
      .buildWrap { grid-template-columns: 1fr; }
      .slotBoard { grid-template-columns: repeat(2, minmax(100px,1fr)); }
      body { padding: 14px; }
      .topbar { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="brand">Rookie <span class="accent">to Legend</span></div>
      <div class="modeSelector">
        <div class="pill active" data-mode="hitter">Hitter</div>
        <div class="pill" data-mode="pitcher">Pitcher</div>
      </div>
    </div>

    <section class="panel">
      <div class="originGrid">
        <div class="field">
          <label>Name</label>
          <input id="nameInput" value="Rookie" maxlength="24" />
        </div>
        <div class="field">
          <label>Handedness</label>
          <select id="handInput">
            <option value="R">R</option>
            <option value="L">L</option>
            <option value="S">S</option>
          </select>
        </div>
        <div class="field">
          <label>Position / Role</label>
          <select id="positionInput"></select>
        </div>
        <div class="field">
          <label>Origin</label>
          <select id="originInput">
            <option value="High School">High School</option>
            <option value="College">College</option>
            <option value="International">International</option>
            <option value="Independent League">Independent League</option>
            <option value="Overseas Pro">Overseas Pro</option>
          </select>
        </div>
        <div class="field">
          <label>Archetype</label>
          <select id="archetypeInput"></select>
        </div>
      </div>
    </section>

    <section class="panel">
      <div class="buildWrap">
        <div class="reelCard">
          <div class="playerHeadline">
            <div>
              <div class="playerMeta" id="playerMetaLabel">Current card</div>
              <div class="playerName" id="playerName">Waiting for a spin</div>
            </div>
            <div class="bigRating" id="reelOverall">--</div>
          </div>
          <div id="reelAttributes" class="statsGrid"></div>
          <div class="actions">
            <button id="spinBtn" class="button">Spin Build</button>
            <button id="autoFillBtn" class="button secondary">Quick Fill</button>
            <button id="resetBtn" class="button warn">Reset</button>
          </div>
        </div>

        <div class="statsPanel">
          <div class="metricBox">
            <div class="label">Projected Overall</div>
            <div class="value" id="projectedOverall">0</div>
          </div>
          <div class="metricBox">
            <div class="label">Build Status</div>
            <div class="value" id="buildStatus">0 / 8</div>
            <div class="powerList" id="powerTagList"></div>
          </div>
          <div class="metricBox">
            <div class="label">Draft Stock</div>
            <div class="value" id="draftStock">--</div>
          </div>
          <div class="actions">
            <button id="careerBtn" class="button">Start Career</button>
          </div>
        </div>
      </div>
    </section>

    <section class="panel">
      <div class="slotBoard" id="slotBoard"></div>
    </section>

    <section class="panel careerSection" id="careerSection">
      <h2>Career Summary</h2>
      <div id="careerSummary" class="statsGrid" style="margin-top: 10px"></div>
      <div class="seasonList" id="seasonList" style="margin-top: 18px"></div>
    </section>
  </div>

    const SLOT_DEFS = {

    const ARCHETYPES = {
      hitter: ['Slugger', 'Table Setter', 'Five Tool', 'Contact Artist', 'Glove First', 'Late Bloomer'],

    const state = {
      mode: 'hitter',

      handed: 'R',
      position: 'CF',
      origin: 'High School',
      archetype: 'Slugger',
      currentCard: null,
      assignmentMap: {},
      career: null,
      built: false

    function clamp(value, min, max) {
      return Math.min(max, Math.max(min, value));
    }

    function average(list) {
      if (!list.length) return 0;
      return list.reduce((sum, value) => sum + value, 0) / list.length;
    }

    function tierFromValue(value) {
      if (value >= 95) return 'Legend';
      if (value >= 90) return 'Diamond';
      if (value >= 85) return 'Platinum';
      if (value >= 78) return 'Gold';
      if (value >= 70) return 'Silver';
      if (value >= 60) return 'Bronze';
      return 'Common';
    }

    function makePlayerCard(pool, mode) {
      const player = pool[Math.floor(Math.random() * pool.length)];
      const attrs = {}
      for (const slot of SLOT_DEFS[mode]) {
        const key = slot.key;
        let value = player[key] ?? player[key === 'Strikeout' ? 'Str' : key === 'Ground Ball' ? 'GB' : key === 'Velocity' ? 'Vel' : key === 'Break' ? 'Brk' : key === 'Command' ? 'Cmd' : key === 'Stamina' ? 'Sta' : key === 'Frame' ? 'Frm' : key === 'Contact' ? 'Con' : key === 'Power' ? 'Pow' : key === 'Vision' ? 'Vis' : key === 'Discipline' ? 'Dis' : key === 'Clutch' ? 'Clu' : key === 'Speed' ? 'Spd' : key === 'Defense' ? 'Def' : key === 'Strikeout' ? 'Str' : 'Con'];
        if (typeof value === 'undefined') value = Math.round(50 + Math.random() * 30);
        attrs[key] = clamp(value, 30, 99);
      }
      return { player, attrs, tier: tierFromValue(Math.max(...Object.values(attrs))) };
    }

    function renderModeOptions() {
      const posSelect = document.getElementById('positionInput');
      const archSelect = document.getElementById('archetypeInput');
      posSelect.innerHTML = '';
      archSelect.innerHTML = '';

      const positions = POSITION_MAP[state.mode];
      positions.forEach((value) => {
        const option = document.createElement('option');
        option.value = value; option.textContent = value;
        posSelect.appendChild(option);
      });
      state.position = posSelect.value;

      ARCHETYPES[state.mode].forEach((value) => {
        const option = document.createElement('option');
        option.value = value; option.textContent = value;
        archSelect.appendChild(option);
      });
      state.archetype = archSelect.value;
    }

    function updateMode(mode) {
      state.mode = mode;
      document.querySelectorAll('.pill').forEach((button) => {
        button.classList.toggle('active', button.dataset.mode === mode);
      });
      renderModeOptions();
      resetBuild();
    }

    function resetBuild() {
      state.assignmentMap = {};
      state.currentCard = null;
      state.built = false;
      renderSlots();
      renderReel();
      updateProjectedOverall();
      document.getElementById('careerSection').classList.remove('visible');
    }

    function renderSlots() {
      const board = document.getElementById('slotBoard');
      board.innerHTML = '';
      const slots = SLOT_DEFS[state.mode];
      slots.forEach((slot) => {
        const div = document.createElement('button');
        div.className = 'slot ' + (state.assignmentMap[slot.key] ? 'filled' : 'empty');
        div.type = 'button';
        div.innerHTML = `
          <div class="slotLabel">${slot.label}</div>
          <div class="slotValue">${state.assignmentMap[slot.key] ?? '--'}</div>
        `;
        div.addEventListener('click', () => {
          if (!state.currentCard) return;
          if (state.assignmentMap[slot.key] !== undefined) return;
          state.assignmentMap[slot.key] = state.currentCard.attrs[slot.key];
          state.currentCard = null;
          renderSlots();
          renderReel();
          updateProjectedOverall();
        });
        board.appendChild(div);
      });
    }

    function renderReel() {
      const nameEl = document.getElementById('playerName');
      const metaEl = document.getElementById('playerMetaLabel');
      const ratingEl = document.getElementById('reelOverall');
      const statGrid = document.getElementById('reelAttributes');
      if (!state.currentCard) {
        nameEl.textContent = 'Waiting for a spin';
        metaEl.textContent = 'Current card';
        ratingEl.textContent = '--';
        statGrid.innerHTML = '';
        return;
      }
      const card = state.currentCard;
      const player = card.player;
      nameEl.textContent = player.name;
      metaEl.textContent = `${player.team} • ${player.era} • ${player.country}`;
      const overall = average(Object.values(card.attrs));
      ratingEl.textContent = Math.round(overall);
      statGrid.innerHTML = '';
      Object.entries(card.attrs).forEach(([key, value]) => {
        const el = document.createElement('div');
        el.className = 'miniStat';
        el.innerHTML = `<div class="k">${key}</div><div class="v">${value}</div>`;
        statGrid.appendChild(el);
      });
    }

    function updateProjectedOverall() {
      const slots = SLOT_DEFS[state.mode];
      const entries = slots.filter((slot) => state.assignmentMap[slot.key] !== undefined)
        .map((slot) => [slot.key, state.assignmentMap[slot.key]]);
      const overall = calculateOverall(entries);
      document.getElementById('projectedOverall').textContent = Math.round(overall);
      document.getElementById('buildStatus').textContent = `${entries.length} / ${slots.length}`;
      const tags = [];
      if (overall >= 85) tags.push('Star');
      if (overall >= 75) tags.push('Ready');
      if (entries.length >= slots.length * 0.75) tags.push('Strong');
      if (state.currentCard) tags.push('Live');
      document.getElementById('powerTagList').innerHTML = tags.map((tag) => `<span class="tag good">${tag}</span>`).join('');
      const draftStock = Math.round(overall + (state.origin === 'College' ? 4 : 0) + (state.origin === 'International' ? 6 : 0) + (state.archetype === 'Five Tool' ? 3 : 0));
      document.getElementById('draftStock').textContent = `${draftStock} / 99`;
    }

    function calculateOverall(entries) {
      const weights = {
        hitter: {
          Contact: 1.25, Power: 1.2, Discipline: 1.1, Vision: 1.1, Clutch: 1.0, Speed: 0.9, Defense: 1.0, Frame: 0.5,
        },
        pitcher: {
          Strikeout: 1.25, 'Ground Ball': 1.1, Command: 1.25, Velocity: 1.0, Break: 1.1, Stamina: 1.0, Clutch: 1.0, Defense: 0.5, Frame: 0.5,
        }
      };
      const map = Object.fromEntries(entries);
      const totalWeight = Object.entries(map).reduce((sum, [key, value]) => sum + (weights[state.mode][key] || 1), 0);
      if (!totalWeight) return 0;
      const weighted = Object.entries(map).reduce((sum, [key, value]) => sum + value * (weights[state.mode][key] || 1), 0);
      return weighted / totalWeight;
    }

    function spinBuild() {
      const pool = state.mode === 'hitter' ? hitterPool : pitcherPool;
      const card = makePlayerCard(pool, state.mode);
      state.currentCard = card;
      renderReel();
      renderSlots();
    }

    function quickFill() {
      state.assignmentMap = {};
      const slots = SLOT_DEFS[state.mode];
      const pool = state.mode === 'hitter' ? hitterPool : pitcherPool;
      slots.forEach((slot) => {
        const card = makePlayerCard(pool, state.mode);
        state.assignmentMap[slot.key] = card.attrs[slot.key];
      });
      state.currentCard = null;
      renderSlots();
      renderReel();
      updateProjectedOverall();
    }

    function simulateCareer() {
      const totalAssigned = Object.keys(state.assignmentMap).length;
      const slots = SLOT_DEFS[state.mode];
      if (totalAssigned < slots.length) {
        alert('Fill all slots before starting your career.');
        return;
      }

      const currentOverall = Math.round(calculateOverall(Object.entries(state.assignmentMap)));
      const buildValue = currentOverall;
      const careerYears = [];
      const randomize = (base, spread) => clamp(base + (Math.random() - 0.5) * spread, 0, 999);

      const seasons = state.mode === 'hitter' ? 8 : 7;
      for (let year = 1; year <= seasons; year++) {
        if (state.mode === 'hitter') {
          const avg = clamp(0.255 + (buildValue - 55) / 400 + (Math.random() - 0.5) * 0.05, 0.210, 0.360);
          const hr = clamp(8 + ((buildValue - 60) / 2) + Math.random() * 18, 4, 55);
          const rbi = clamp(45 + (buildValue - 50) * 1.2 + Math.random() * 70, 30, 150);
          const sb = clamp((state.assignmentMap.Speed || 60) / 4.5 + Math.random() * 15, 0, 60);
          const war = clamp(0.8 + ((buildValue - 50) / 16) + Math.random() * 4.2, 0.2, 10.8);
          const award = year % 4 === 0 ? 'All-Star' : year === 1 ? 'Rookie of the Year' : (Math.random() > 0.7 ? 'Silver Slugger' : '');
          careerYears.push({ year, title: `Season ${year}`, stats: `AVG ${avg.toFixed(3)} • HR ${Math.round(hr)} • RBI ${Math.round(rbi)} • SB ${Math.round(sb)} • WAR ${war.toFixed(1)}${award ? ` • ${award}` : ''}` });
        } else {
          const era = clamp(2.8 - ((buildValue - 60) / 20) + (Math.random() - 0.5) * 1.0, 1.6, 5.0);
          const strikeouts = clamp(120 + (buildValue - 50) * 3 + Math.random() * 90, 80, 320);
          const wins = clamp(6 + (buildValue - 60) * 0.35 + Math.random() * 12, 3, 24);
          const war = clamp(0.9 + ((buildValue - 50) / 14) + Math.random() * 4.5, 0.6, 10.5);
          const award = year % 4 === 0 ? 'Cy Young' : year === 1 ? 'Rookie of the Year' : (Math.random() > 0.75 ? 'ERA Title' : '');
          careerYears.push({ year, title: `Season ${year}`, stats: `W ${Math.round(wins)} • ERA ${era.toFixed(2)} • K ${Math.round(strikeouts)} • WAR ${war.toFixed(1)}${award ? ` • ${award}` : ''}` });
        }
      }

      const legacy = clamp((currentOverall * 1.35) + (careerYears.length * 3.8) + (state.mode === 'hitter' ? 16 : 14), 0, 99);
      const verdict = legacy >= 80 ? 'Hall of Famer' : legacy >= 62 ? 'All-Star Track' : legacy >= 40 ? 'Solid Regular' : legacy >= 20 ? 'Role Player' : 'Cup of Coffee';

      state.career = {
        title: `${state.name} • ${state.mode === 'hitter' ? 'Hitter' : 'Pitcher'} career`,
        overall: currentOverall,
        legacy,
        verdict,
        seasons: careerYears,
        position: state.position,
        origin: state.origin,
        archetype: state.archetype,
        team: state.mode === 'hitter' ? 'Drafted to a contender' : 'Developed as a starter'
      };

      renderCareer();
    }

    function renderCareer() {
      const section = document.getElementById('careerSection');
      const summary = document.getElementById('careerSummary');
      const list = document.getElementById('seasonList');
      if (!state.career) return;
      section.classList.add('visible');
      summary.innerHTML = `
        <div class="miniStat"><div class="k">Name</div><div class="v">${state.name}</div></div>
        <div class="miniStat"><div class="k">Overall</div><div class="v">${state.career.overall}</div></div>
        <div class="miniStat"><div class="k">Legacy</div><div class="v">${state.career.legacy.toFixed(1)}</div></div>
        <div class="miniStat"><div class="k">Verdict</div><div class="v">${state.career.verdict}</div></div>
      `;
      list.innerHTML = state.career.seasons.map((season) => `
        <div class="seasonCard">
          <div class="seasonTop">
            <strong>${season.title}</strong>
            <div class="seasonMeta">${season.stats}</div>
          </div>
          <div class="timeline">
            <span class="chip">${state.mode === 'hitter' ? 'Plate discipline' : 'Bullpen pressure'}</span>
            <span class="chip">${state.origin}</span>
            <span class="chip">${state.archetype}</span>
          </div>
        </div>
      `).join('');
    }

    function attachHandlers() {
      document.querySelectorAll('.pill').forEach((button) => {
        button.addEventListener('click', () => updateMode(button.dataset.mode));
      });

      document.getElementById('nameInput').addEventListener('input', (event) => {
        state.name = event.target.value.trim() || 'Rookie';
      });

      document.getElementById('handInput').addEventListener('change', (event) => {
        state.handed = event.target.value;
      });

      document.getElementById('positionInput').addEventListener('change', (event) => {
        state.position = event.target.value;
      });

      document.getElementById('originInput').addEventListener('change', (event) => {
        state.origin = event.target.value;
        updateProjectedOverall();
      });

      document.getElementById('archetypeInput').addEventListener('change', (event) => {
        state.archetype = event.target.value;
        updateProjectedOverall();
      });

      document.getElementById('spinBtn').addEventListener('click', spinBuild);
      document.getElementById('autoFillBtn').addEventListener('click', quickFill);
      document.getElementById('resetBtn').addEventListener('click', resetBuild);
      document.getElementById('careerBtn').addEventListener('click', simulateCareer);
    }

    function init() {
      renderModeOptions();
      attachHandlers();
      resetBuild();
    }

    init();
  </script>
</body>
</html>
